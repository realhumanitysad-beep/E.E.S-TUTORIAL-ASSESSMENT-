<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMPEE Mock Test | E.E.S</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--text:#17211b;--muted:#5c6b61;--line:#d8e0da;--accent:#0b6b45;--on:#fff;--soft:#e3f2ea;--good:#0b6b45;--bad:#b3261e;--badbg:#fbeae8}
@media (prefers-color-scheme:dark){:root{--bg:#101512;--card:#1a221d;--text:#e8efea;--muted:#9dada2;--line:#2e3a32;--accent:#4fd19a;--on:#08140e;--soft:#183528;--good:#4fd19a;--bad:#ff8a80;--badbg:#3a1d1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{margin:0 0 8px;font-size:1.8rem}h2{font-size:1.2rem;margin:12px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 16px;min-height:48px}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
.opt{display:flex;gap:12px;width:100%;text-align:left;margin-bottom:10px}
.opt b{color:var(--accent)}
.opt[aria-pressed=true]{background:var(--soft);border:2px solid var(--accent)}
.row{display:flex;gap:10px;margin-top:6px}.row button{flex:1}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:12px}
.grid button{padding:0;min-height:44px;font-size:.85rem}
.grid .done{background:var(--soft)}.grid .now{border:2px solid var(--accent);font-weight:700}
.brand{background:#fff;border-radius:14px;padding:10px;margin-bottom:14px;border:1px solid var(--line)}
.brand img{display:block;width:100%;max-width:440px;height:auto;margin:auto}
footer{text-align:center;margin-top:24px}
.score{text-align:center}.score .big{font-size:3.4rem;font-weight:800;color:var(--accent);line-height:1.1}
.wrong{color:var(--bad)}.right{color:var(--good)}
.ans{padding:8px 12px;border-radius:8px;margin-top:8px}
.ans.wrong{background:var(--badbg)}.ans.right{background:var(--soft)}
</style>
</head>

<script>
// Format: [subject, question, CORRECT answer, wrong, wrong, wrong]
const Q = [
["Nigeria","What is the capital of Nigeria?","Abuja","Lagos","Kano","Ibadan"],
["Nigeria","In what year did Nigeria gain independence?","1960","1957","1963","1970"],
["Nigeria","Which two major rivers meet at Lokoja?","Niger and Benue","Niger and Ogun","Benue and Kaduna","Cross and Niger"],
["Nigeria","How many states does Nigeria have (excluding the FCT)?","36","30","33","37"],
["Nigeria","Who was Nigeria's first President?","Nnamdi Azikiwe","Tafawa Balewa","Obafemi Awolowo","Ahmadu Bello"],
["Nigeria","What is the currency of Nigeria?","Naira","Cedi","Shilling","Rand"],
["Nigeria","Which Nigerian won the Nobel Prize in Literature in 1986?","Wole Soyinka","Chinua Achebe","Ben Okri","Chimamanda Adichie"],
["Nigeria","Who wrote the novel 'Things Fall Apart'?","Chinua Achebe","Wole Soyinka","Cyprian Ekwensi","Buchi Emecheta"],
["Nigeria","What colours are on the Nigerian flag?","Green and white","Green and yellow","Red and white","Blue and white"],
["Nigeria","Olumo Rock is found in which state?","Ogun","Oyo","Osun","Ondo"],
["Geography","Which is the largest continent by area?","Asia","Africa","North America","Europe"],
["Geography","Which is the largest ocean?","Pacific","Atlantic","Indian","Arctic"],
["Geography","What is the highest mountain in Africa?","Kilimanjaro","Mount Kenya","Mount Cameroon","Atlas"],
["Geography","What is the capital of Ghana?","Accra","Kumasi","Lomé","Abidjan"],
["Geography","What is the capital of Kenya?","Nairobi","Mombasa","Kampala","Dodoma"],
["Geography","What is the capital of Japan?","Tokyo","Kyoto","Osaka","Seoul"],
["Geography","Which is the largest country in the world by area?","Russia","Canada","China","United States"],
["Geography","The Sahara Desert is mainly in which part of Africa?","North","South","East","Central"],
["Geography","What is the capital of Australia?","Canberra","Sydney","Melbourne","Perth"],
["Geography","The pyramids of Giza are in which country?","Egypt","Sudan","Mexico","Iraq"],
["Science","What is the chemical symbol for water?","H₂O","CO₂","O₂","NaCl"],
["Science","Which planet is closest to the Sun?","Mercury","Venus","Earth","Mars"],
["Science","Which is the largest planet in our solar system?","Jupiter","Saturn","Neptune","Uranus"],
["Science","Which planet is known as the Red Planet?","Mars","Venus","Jupiter","Mercury"],
["Science","Which gas do plants take in for photosynthesis?","Carbon dioxide","Oxygen","Nitrogen","Hydrogen"],
["Science","What is the chemical symbol for gold?","Au","Ag","Gd","Go"],
["Science","What is the chemical symbol for iron?","Fe","Ir","In","I"],
["Science","What is the boiling point of pure water at sea level?","100°C","90°C","120°C","80°C"],
["Science","What is the SI unit of force?","Newton","Joule","Watt","Pascal"],
["Science","What is the SI unit of electric current?","Ampere","Volt","Ohm","Coulomb"],
["Science","Which gas is most abundant in Earth's atmosphere?","Nitrogen","Oxygen","Carbon dioxide","Argon"],
["Biology","Which organ pumps blood around the body?","Heart","Liver","Lungs","Kidney"],
["Biology","Which part of the cell is called the powerhouse?","Mitochondrion","Nucleus","Ribosome","Vacuole"],
["Biology","How many bones are in a typical adult human body?","206","186","226","306"],
["Biology","Which blood cells help fight infection?","White blood cells","Red blood cells","Platelets","Nerve cells"],
["Biology","Which vitamin does the skin make in sunlight?","Vitamin D","Vitamin A","Vitamin C","Vitamin K"],
["Biology","Which insect spreads malaria?","Female Anopheles mosquito","Tsetse fly","Housefly","Male Aedes mosquito"],
["Biology","What is the largest organ of the human body?","Skin","Liver","Brain","Lungs"],
["Maths","What is 12 × 12?","144","124","132","154"],
["Maths","What is 15% of 200?","30","15","25","35"],
["Maths","What is the square root of 81?","9","8","7","11"],
["Maths","The angles in a triangle add up to?","180°","90°","270°","360°"],
["Maths","Solve: 2x + 6 = 20. What is x?","7","8","13","6"],
["Maths","Which of these is a prime number?","29","21","27","33"],
["Maths","What is 3/4 as a percentage?","75%","34%","70%","80%"],
["Maths","What is 7 + 3 × 4?","19","40","14","25"],
["Maths","How many sides does a hexagon have?","6","5","7","8"],
["English","Choose the correct sentence.","She doesn't like rice.","She don't like rice.","She not like rice.","She doesn't likes rice."],
["English","What is the plural of 'child'?","Children","Childs","Childrens","Childes"],
["English","What is the opposite of 'ancient'?","Modern","Old","Historic","Antique"],
["English","Which word is a synonym of 'happy'?","Joyful","Gloomy","Angry","Weary"],
["English","In 'He ran quickly', what part of speech is 'quickly'?","Adverb","Adjective","Verb","Noun"],
["English","Which word is spelt correctly?","Necessary","Neccessary","Necesary","Neccesary"],
["Technology","What does CPU stand for?","Central Processing Unit","Computer Personal Unit","Central Program Utility","Control Power Unit"],
["Technology","What does 'www' stand for?","World Wide Web","World Web Window","Wide World Web","Web World Wide"],
["Technology","Which language gives web pages their structure?","HTML","Python","SQL","C++"],
["Technology","Which company develops the Android operating system?","Google","Apple","Microsoft","Nokia"],
["Technology","How many bits make one byte?","8","4","16","10"],
["History","Who was the first President of post-apartheid South Africa?","Nelson Mandela","Thabo Mbeki","Desmond Tutu","F. W. de Klerk"],
["History","In what year did the Second World War end?","1945","1939","1918","1950"]
];

const app = document.getElementById("app"), KEY = "brainCheck1";
let S = null; // {order, opts, picks, at, done}
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save = () => { try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} };
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    return s && s.count===Q.length ? s : null;
  }catch(e){return null}
}
function newQuiz(){
  S = {count:Q.length, order:shuffle(Q.map((_,i)=>i)), opts:Q.map(()=>shuffle([0,1,2,3])), picks:Q.map(()=>null), at:0, done:false};
  save(); quiz();
}
const text = (qi,o) => Q[qi][2+o]; // option 0 is always the correct one
const answered = () => S.picks.filter(p=>p!==null).length;

function home(){
  const old = load();
  app.innerHTML = `<div class="card"><h1>EMPEE Mock Test</h1>
  <p class="muted">By EMPEE Educational Services (E.E.S)</p>
  <p>${Q.length} questions on Nigeria, geography, science, biology, maths, English, technology and history.</p>
  <p class="muted">Pick one of four options for each. Your grade, mistakes and the right answers appear after you submit.</p>
  <div class="row">${old?'<button id="resume">'+(old.done?"See last result":"Continue")+'</button>':''}<button class="primary" id="start">Start quiz</button></div></div>`;
  document.getElementById("start").onclick = newQuiz;
  if(old) document.getElementById("resume").onclick = () => { S=old; S.done?result():quiz() };
}

function quiz(confirming){
  const n=S.at, qi=S.order[n], q=Q[qi], total=Q.length;
  app.innerHTML = `<div class="muted">Question ${n+1} of ${total} · ${answered()} answered</div>
  <div class="bar"><div style="width:${answered()/total*100}%"></div></div>
  <div class="card"><div class="muted">${q[0]}</div><h2>${esc(q[1])}</h2>
  ${S.opts[qi].map((o,i)=>`<button class="opt" data-o="${o}" aria-pressed="${S.picks[qi]===o}"><b>${"ABCD"[i]}</b><span>${esc(text(qi,o))}</span></button>`).join("")}
  <div class="row"><button id="back" ${n?"":"disabled"}>Back</button><button id="next" class="primary">${n===total-1?"Submit":"Next"}</button></div></div>
  ${confirming?`<div class="card" id="confirm"><b>${total-answered()} question(s) unanswered.</b><p class="muted">Unanswered questions are marked wrong.</p><div class="row"><button id="review">Go to first one</button><button id="yes" class="primary">Submit anyway</button></div></div>`:`<div class="row"><button id="finish">Submit quiz now</button></div>`}
  <div class="grid">${S.order.map((id,i)=>`<button data-j="${i}" class="${S.picks[id]!==null?"done":""} ${i===n?"now":""}" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.picks[qi]=+b.dataset.o;save();quiz()});
  app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>go(+b.dataset.j));
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
  const trySubmit=()=>{ if(answered()<total){quiz(true);document.getElementById("confirm").scrollIntoView({block:"center"})} else submit() };
  on("back",()=>go(n-1));
  on("next",()=>n===total-1?trySubmit():go(n+1));
  on("finish",trySubmit);
  on("yes",submit);
  on("review",()=>go(S.order.findIndex(id=>S.picks[id]===null)));
}
function go(i){S.at=i;save();quiz();scrollTo(0,0)}
function submit(){S.done=true;save();result();scrollTo(0,0)}

function grade(p){
  return p>=70?["A","Excellent!"]:p>=60?["B","Very good."]:p>=50?["C","Good, keep going."]:p>=45?["D","Fair. Review your mistakes."]:p>=40?["E","A narrow pass. Practise more."]:["F","Study the answers and try again."];
}
function result(mode="mistakes"){
  const total=Q.length, score=S.order.filter(id=>S.picks[id]===0).length;
  const pct=Math.floor(score/total*100), [g,msg]=grade(pct), skipped=total-answered();
  const list=S.order.map((id,n)=>({id,n})).filter(x=>mode==="all"||S.picks[x.id]!==0);
  app.innerHTML=`<div class="card score"><div class="muted">EMPEE Mock Test · Your grade</div><div class="big">${g}</div>
  <h2>${score} / ${total} (${pct}%)</h2><p>${msg}</p>
  <p class="muted">Correct: ${score} · Wrong: ${total-score-skipped} · Skipped: ${skipped}</p>
  <p class="muted">A 70+ · B 60–69 · C 50–59 · D 45–49 · E 40–44 · F below 40</p>
  <div class="row"><button class="primary" id="again">Try again</button></div></div>
  <div class="row"><button id="m" class="${mode==="mistakes"?"primary":""}">Mistakes (${total-score})</button><button id="a" class="${mode==="all"?"primary":""}">All answers</button></div><br>
  ${list.length?list.map(({id,n})=>{const p=S.picks[id];return `<div class="card"><div class="muted">${n+1}. ${Q[id][0]}</div><b>${esc(Q[id][1])}</b>
  ${p===0?`<div class="ans right">✓ Your answer: ${esc(text(id,0))}</div>`:`<div class="ans wrong">✗ Your answer: ${p===null?"Not answered":esc(text(id,p))}</div><div class="ans right">✓ Right answer: ${esc(text(id,0))}</div>`}</div>`}).join(""):'<div class="card">No mistakes. Perfect score! 🎉</div>'}`;
  document.getElementById("again").onclick=()=>{newQuiz();scrollTo(0,0)};
  document.getElementById("m").onclick=()=>result("mistakes");
  document.getElementById("a").onclick=()=>result("all");
}
home();
</script>
</body>
</html>
